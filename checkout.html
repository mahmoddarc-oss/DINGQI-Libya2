<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#111111"><title>إتمام الطلب | DINGQI Libya</title><style>
:root{--gold:#f5a400;--dark:#111;--bg:#f5f6f8;--muted:#70757d;--ok:#148a52}*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:#151515}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:#111;color:#fff;border-bottom:3px solid var(--gold);padding:13px 16px;position:sticky;top:0;z-index:10}.topin{max-width:680px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:19px}.brand small{display:block;color:var(--gold);font-size:11px;margin-top:3px}.back{border:0;background:#242424;color:#fff;border-radius:11px;padding:9px 13px}.wrap{max-width:680px;margin:auto;padding:20px 14px 40px}.head{text-align:center;padding:12px 0 18px}.head .icon{font-size:30px}.head h1{font-size:clamp(30px,8vw,44px);margin:4px 0 6px;font-weight:900}.head p{margin:0;color:#777}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #0000000b}.card h2{margin:0 0 14px;font-size:21px}.summary-item{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eee}.summary-item:last-child{border-bottom:0}.summary-item img{width:58px;height:58px;object-fit:contain;background:#fafafa;border-radius:9px}.summary-info{flex:1;min-width:0}.summary-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary-meta{color:#777;font-size:13px;margin-top:4px}.summary-price{font-weight:900;white-space:nowrap}.summary-remove{border:0;background:#fff0ef;color:#a9231d;border-radius:9px;padding:8px 10px;font-weight:800;white-space:nowrap}.clear-cart{width:100%;margin-top:10px;border:0;background:#eee;color:#111;border-radius:11px;padding:11px;font-weight:800}.row{display:flex;gap:9px}.field{margin-bottom:11px}.field label{display:block;font-weight:800;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:11px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #f5a40022}.field textarea{min-height:95px;resize:vertical}.totals{display:grid;gap:8px}.totals div{display:flex;justify-content:space-between}.grand{border-top:1px solid #eee;padding-top:11px;margin-top:3px;font-size:20px;font-weight:900}.grand b{font-size:26px}.submit{width:100%;border:0;background:var(--gold);color:#111;border-radius:35px;padding:16px;font-size:20px;font-weight:900;box-shadow:0 7px 18px #00000020}.cancel{width:100%;margin-top:9px;border:0;background:#eee;color:#111;border-radius:12px;padding:12px;font-weight:800}.empty{text-align:center;padding:50px 15px}.success{display:none;text-align:center}.success .check{font-size:55px}.success h2{font-size:28px;margin:8px 0}.success p{color:#666;line-height:1.8}.success button{border:0;background:var(--gold);padding:13px 22px;border-radius:12px;font-weight:900}.loading{opacity:.65;pointer-events:none}@media(max-width:560px){.wrap{padding:12px 10px 30px}.card{padding:15px;border-radius:17px}.head{padding-top:10px}.row{display:block}.field input,.field select,.field textarea{font-size:16px}.submit{font-size:19px}}
</style></head><body><header class="top"><div class="topin"><div class="brand">DINGQI Libya<small>معدات الورش الاحترافية</small></div><button class="back" onclick="backToCart()">← السلة</button></div></header><main class="wrap"><section class="head"><div class="icon">📦</div><h1>إتمام الطلب</h1><p>أدخل بياناتك لإتمام طلبك</p></section><div id="mainContent"><section class="card"><h2>🛒 منتجاتك</h2><div id="orderItems"></div><button class="clear-cart" type="button" onclick="clearCheckoutCart()">إزالة جميع المنتجات</button></section><section class="card"><h2>📍 بيانات التوصيل</h2><div class="field"><label>الاسم الكامل</label><input id="customerName" autocomplete="name" placeholder="اكتب اسمك الكامل"></div><div class="row"><div class="field" style="flex:1"><label>رقم الهاتف</label><input id="customerPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="رقم الهاتف"></div><div class="field" style="flex:1"><label>منطقة التوصيل</label><select id="deliveryArea" onchange="renderSummary()"><option value="">اختر المنطقة</option></select></div></div><div class="field"><label>العنوان بالتفصيل</label><input id="customerAddress" autocomplete="street-address" placeholder="المنطقة، الشارع، أقرب نقطة دالة"></div><div class="field"><label>ملاحظات إضافية <span style="color:#888;font-weight:normal">(اختياري)</span></label><textarea id="customerNotes" placeholder="أي ملاحظات تخص الطلب"></textarea></div></section><section class="card"><h2>💰 ملخص الطلب</h2><div class="totals"><div><span>المنتجات</span><b id="subtotal">0 د.ل</b></div><div><span>التوصيل</span><b id="delivery">0 د.ل</b></div><div class="grand"><span>الإجمالي النهائي</span><b id="total">0 د.ل</b></div></div></section><section class="card"><button id="submitBtn" class="submit" onclick="sendOrder()">📲 تأكيد الطلب وإرساله عبر واتساب</button><button class="cancel" onclick="backToCart()">العودة إلى السلة</button></section></div><section id="success" class="card success"><div class="check">✅</div><h2>تم استلام طلبك</h2><p id="successText"></p><button onclick="location.href='index.html'">العودة للمتجر</button></section></main><script>
const WA='218946961543',CART='dingqi_cart_v2',CUSTOMER='dingqi_customer_v2';let products=[],settings={},cart=JSON.parse(localStorage.getItem(CART)||'[]');const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('ar-LY')+' د.ل';
async function api(url,opts={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(url,{...opts,signal:controller.signal});const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={error:text||'استجابة غير صالحة'}}if(!r.ok)throw Error(data.error||`HTTP ${r.status}`);return data}finally{clearTimeout(timer)}}
function currentPrice(p){return p.salePrice!=null&&p.salePrice<p.price?p.salePrice:p.price}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function backToCart(){location.href='index.html'}
function saveCustomer(){localStorage.setItem(CUSTOMER,JSON.stringify({name:$('customerName').value,phone:$('customerPhone').value,address:$('customerAddress').value,notes:$('customerNotes').value,area:$('deliveryArea').value}))}
function loadCustomer(){try{const c=JSON.parse(localStorage.getItem(CUSTOMER)||'null');if(!c)return;$('customerName').value=c.name||'';$('customerPhone').value=c.phone||'';$('customerAddress').value=c.address||'';$('customerNotes').value=c.notes||'';$('deliveryArea').value=c.area||''}catch{}}
function fillAreas(){const a=settings.delivery||{};$('deliveryArea').innerHTML='<option value="">اختر المنطقة</option>'+Object.entries(a).map(([k,v])=>`<option value="${esc(k)}">${esc(k)} — ${money(v)}</option>`).join('')}
function removeCheckoutItem(id){cart=cart.filter(x=>String(x.id)!==String(id));localStorage.setItem(CART,JSON.stringify(cart));if(!cart.length){backToCart();return}renderSummary()}
function clearCheckoutCart(){if(!cart.length)return;if(confirm('إزالة جميع المنتجات من السلة؟')){cart=[];localStorage.setItem(CART,'[]');backToCart()}}
function renderSummary(){let sub=0;const area=$('deliveryArea').value;const fee=Number((settings.delivery||{})[area]||0);$('orderItems').innerHTML=cart.map(x=>{const p=products.find(y=>String(y.id)===String(x.id));if(!p)return'';const line=currentPrice(p)*x.qty;sub+=line;return `<div class="summary-item"><img src="${esc(p.image||'')}" loading="lazy" decoding="async" onerror="this.style.display='none'"><div class="summary-info"><div class="summary-name">${esc(p.name)}</div><div class="summary-meta">الكمية: ${x.qty} × ${money(currentPrice(p))}</div></div><div class="summary-price">${money(line)}</div><button type="button" class="summary-remove" onclick="removeCheckoutItem('${esc(p.id)}')">حذف</button></div>`}).join('');$('subtotal').textContent=money(sub);$('delivery').textContent=money(fee);$('total').textContent=money(sub+fee)}
async function sendOrder(){if(!cart.length)return alert('السلة فارغة.');const name=$('customerName').value.trim(),phone=$('customerPhone').value.trim(),address=$('customerAddress').value.trim(),area=$('deliveryArea').value;if(!name||!phone||!address||!area)return alert('يرجى إكمال الاسم والهاتف والعنوان ومنطقة التوصيل.');const delivery=Number((settings.delivery||{})[area]||0);const items=cart.map(x=>{const p=products.find(y=>String(y.id)===String(x.id));if(!p)return null;return{id:p.id,name:p.name,qty:x.qty,price:currentPrice(p),cost:Number(p.cost||0)}});const validItems=items.filter(Boolean);if(!validItems.length)return alert('تعذر العثور على المنتجات في السلة.');const subtotal=validItems.reduce((s,x)=>s+x.price*x.qty,0),grandTotal=subtotal+delivery;const btn=$('submitBtn');btn.classList.add('loading');btn.textContent='جاري إرسال الطلب...';try{const order=await api('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({customer:{name,phone,address,notes:$('customerNotes').value.trim()},deliveryArea:area,delivery,items:validItems,total:subtotal,grandTotal})});const text=`طلب جديد من DINGQI Libya

رقم الطلب: ${order.id}
الاسم: ${name}
الهاتف: ${phone}
المنطقة: ${area}
العنوان: ${address}

المنتجات:
${validItems.map((x,i)=>`${i+1}) ${x.name} × ${x.qty} = ${money(x.price*x.qty)}`).join('\n')}

سعر المنتجات: ${money(subtotal)}
التوصيل: ${money(delivery)}
الإجمالي: ${money(grandTotal)}
الدفع: عند الاستلام
ملاحظات: ${$('customerNotes').value.trim()||'لا توجد'}`;saveCustomer();window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(text),'_blank');cart=[];localStorage.setItem(CART,'[]');$('mainContent').style.display='none';$('success').style.display='block';$('successText').textContent='رقم طلبك: '+order.id+' — تم تجهيز رسالة الطلب عبر واتساب.'}catch(e){btn.classList.remove('loading');btn.textContent='📲 تأكيد الطلب وإرساله عبر واتساب';alert('تعذر حفظ الطلب، حاول مرة أخرى.')}}
['customerName','customerPhone','customerAddress','customerNotes'].forEach(id=>$(id).addEventListener('input',saveCustomer));
async function load(){try{[products,settings]=await Promise.all([api('/api/products'),api('/api/settings')]);if(!cart.length){$('mainContent').innerHTML='<section class="card empty"><div style="font-size:52px">🛒</div><h2>السلة فارغة</h2><p>أضف منتجاتك أولاً ثم ارجع لإتمام الطلب.</p><button class="submit" onclick="backToCart()">العودة للمتجر</button></section>';return}fillAreas();loadCustomer();renderSummary()}catch(e){$('mainContent').innerHTML='<section class="card empty"><h2>تعذر تحميل الطلب</h2><p>تحقق من اتصالك وحاول مرة أخرى.</p><button class="submit" onclick="location.reload()">إعادة المحاولة</button></section>'}}
load();
</script></body></html>
